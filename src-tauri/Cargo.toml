[package]
name = "gap-gone"
version = "0.1.15"
description = "Gap Gone - 录音与音频编辑桌面应用"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gap_gone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
cpal = "0.18.2"
hound = "3.5.1"
ndarray = "0.15"
# SenseVoice 转录：官方 Rust binding，默认静态链接，
# build.rs 按平台自动下载预编译 sherpa-onnx 库。
sherpa-onnx = "1.13"
# 模型文件下载（ModelScope/HuggingFace 单文件直下）。
ureq = "2"
df = { package = "deep_filter", git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", features = ["tract", "default-model"] }
tract-core = "=0.21.4"
tract-data = "=0.21.4"
tract-hir = "=0.21.4"
tract-linalg = "=0.21.4"
tract-nnef = "=0.21.4"
tract-onnx = "=0.21.4"
tract-onnx-opl = "=0.21.4"
tract-pulse = "=0.21.4"
tract-pulse-opl = "=0.21.4"
