[package]
name = "gap-gone"
version = "0.1.64"
description = "Gap Gone - 录音与音频编辑桌面应用"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gap_gone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset：视频预览走 asset 协议流式读原文件（整段读进内存扛不住 GB 级素材）。
# 静态 scope 故意留空，只由 allow_video_asset 动态放行当前导入的那一个文件，见 video.rs。
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
cpal = "0.18.2"
hound = "3.5.1"
ndarray = "0.15"
# SenseVoice 转录：官方 Rust binding，默认静态链接，
# build.rs 按平台自动下载预编译 sherpa-onnx 库。
sherpa-onnx = "1.13"
# 模型文件下载（ModelScope/HuggingFace 单文件直下）。
ureq = "2"
# DeepFilterNet3 **低延迟变体**（`default-model-ll`）。
#
# 为什么不用标准变体（`default-model`）：标准版的图在 tract 0.21.4 上过不了 codegen 之后的
# 图压缩，报 `duplicate name /convt3/Conv.bias` —— 模型加载直接失败，而失败会被前端兜底
# 接住，于是整条降噪悄悄退化成兜底算法（0.1.57 定位，代价是四轮调参全部无效）。
#
# 为什么不升 tract 换回标准版（0.1.58 实测）：`df` 主分支的 HEAD 就是下面这个 rev（上游自
# 那以后没动过），它的代码只和 tract 0.21.4 的 API 对得上 —— 升到 0.21.18（df 的 `^0.21.4`
# 本来允许）会因 `symbol_table` → `symbols` 等改动报 17 个编译错误。**换标准版必须 fork df
# 或 tract 的源码，不是改配置能做到的。** 低延迟变体同架构（48 kHz / hop 480 / fft 960 /
# nb_df 96），只是 lookahead 从 2 帧降到 0，恰好绕开那个算子；代价是体积 7.6 MB → 34.7 MB，
# 而且它是为零延迟实时场景训练的，离线处理时模型自身的痕迹更重。
# 动完**必须**跑 `cargo test --lib deepfilternet_engine_works`：它会直接告诉你引擎还能不能加载。
df = { package = "deep_filter", git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract", "default-model-ll"] }
# 这 9 个版本必须整体锁死在 =0.21.4：df 的代码只对这个版本的 API。升上去 df 编译不过，
# 而沿着 `^0.21.4` 漂到 0.21.18 就是上面说的那条死路。要动就 df 的 rev 和这 9 行一起动。
tract-core = "=0.21.4"
tract-data = "=0.21.4"
tract-hir = "=0.21.4"
tract-linalg = "=0.21.4"
tract-nnef = "=0.21.4"
tract-onnx = "=0.21.4"
tract-onnx-opl = "=0.21.4"
tract-pulse = "=0.21.4"
tract-pulse-opl = "=0.21.4"

# dev 构建默认带**完整**调试信息（debug = 2），而本项目的依赖里有 sherpa-onnx / onnxruntime /
# tract 这些大块头，debug 产物里的 .lib / .pdb 动辄上 GB —— 实测 target/debug 曾涨到 66 GB
# （其中 deps 36 GB、incremental 20 GB）。降到行号级（debug = 1）能明显压小体积，且**不牺牲
# 编译速度与增量编译**；代价是调试时看不到局部变量值，需要完整符号就临时改回 2（注意：改这一项
# 会让所有依赖产物的 hash 失效、触发一次全量重编，所以要么别频繁动，要么配合 cargo clean 一起做）。
# 只影响 dev 构建，release（pnpm tauri build）与安装包不受影响。
[profile.dev]
debug = 1
